spring:
  application.name: permitflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/permitflow}
    username: ${DATABASE_USER:permitflow}
    password: ${DATABASE_PASSWORD:permitflow}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:change-me-in-production-change-me}
server:
  error.include-message: never
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
springdoc:
  api-docs.path: /openapi
  swagger-ui.path: /docs
